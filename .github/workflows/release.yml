name: Release Windows

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Aligner la version sur le tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag de release invalide : $env:RELEASE_TAG" }
          npm version $version --no-git-tag-version --allow-same-version
          $cargo = Get-Content 'src-tauri/Cargo.toml' -Raw
          $cargo = $cargo -replace '(?m)^version = "\d+\.\d+\.\d+[^"]*"', "version = `"$version`""
          [IO.File]::WriteAllText((Join-Path $PWD 'src-tauri/Cargo.toml'), $cargo, [Text.UTF8Encoding]::new($false))
          $packageVersion = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version) { throw "package.json non synchronisé : $packageVersion au lieu de $version" }
          if (-not (Select-String -Path 'src-tauri/Cargo.toml' -Pattern "^version = `"$([regex]::Escape($version))`"$")) { throw "src-tauri/Cargo.toml non synchronisé sur $version" }
          Write-Host "Version synchronisée depuis $env:RELEASE_TAG : package.json=$packageVersion, Cargo.toml=$version"
      - run: npm test
      - run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - name: Build and sign XalLauncher
        run: npm run tauri build
        env:
          XAL_MICROSOFT_CLIENT_ID: ${{ vars.XAL_MICROSOFT_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Prepare updater manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.TrimStart('v')
          $source = 'src-tauri/target/release/bundle/nsis'
          $expectedSetup = "XalLauncher_${version}_x64-setup.exe"
          $setup = Get-ChildItem $source -Filter $expectedSetup | Select-Object -First 1
          if (-not $setup) {
            $found = (Get-ChildItem $source -Filter '*-setup.exe' | ForEach-Object { $_.Name }) -join ', '
            throw "Version incohérente : $expectedSetup introuvable. Artefacts présents : $found"
          }
          $signature = Get-ChildItem $source -Filter '*-setup.exe.sig' | Where-Object { $_.Name -like "*${version}*" } | Select-Object -First 1
          if (-not $signature) { throw "Signature introuvable pour la version $version" }
          $signatureRaw = (Get-Content $signature.FullName -Raw).Trim()
          $signatureText = if ($signatureRaw -match '^untrusted comment') { $signatureRaw } else { [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($signatureRaw)) }
          if ($signatureText -notmatch "version:$([regex]::Escape($version))") { throw "Signature incohérente : elle ne porte pas la version $version" }
          if ($signatureText -notmatch "file:$([regex]::Escape($expectedSetup))") { throw "Signature incohérente : elle ne couvre pas $expectedSetup" }
          Write-Host "Installeur $($setup.Name) compilé et signé pour la version $version"
          $setupName = "XalLauncher-$tag-x64-setup.exe"
          Copy-Item $setup.FullName (Join-Path $source $setupName)
          Copy-Item $signature.FullName (Join-Path $source "$setupName.sig")
          $manifest = @{
            version = $version
            notes = "XalLauncher $tag - https://github.com/RitchiQc/XalLauncher/releases/tag/$tag"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{
              'windows-x86_64' = @{
                signature = (Get-Content $signature.FullName -Raw).Trim()
                url = "https://github.com/RitchiQc/XalLauncher/releases/download/$tag/$setupName"
              }
            }
          } | ConvertTo-Json -Depth 6
          [IO.File]::WriteAllText((Join-Path $source 'latest.json'), $manifest, [Text.UTF8Encoding]::new($false))
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/nsis/XalLauncher-*-setup.exe
            src-tauri/target/release/bundle/nsis/XalLauncher-*-setup.exe.sig
